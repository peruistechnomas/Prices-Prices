name: Svetlana Bot Auto

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  run-svetlana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Run bot script
        run: |
          python svetlana.py

      - name: Save price state changes
        run: |
          git config --global user.name "Svetlana Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add last_prices.json
          git diff --staged --quiet || git commit -m "Update last tracked prices [skip ci]"
          git push
