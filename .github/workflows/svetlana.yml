name: Svetlana Bot Auto

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-svetlana:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run bot
        run: |
          python svetlana.py
